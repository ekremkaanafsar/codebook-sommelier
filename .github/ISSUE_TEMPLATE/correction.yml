name: Correction
description: Report a wrong or outdated value in a catalog row.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: dataset_id
    attributes:
      label: Dataset id
      description: The id shown on the dataset page, for example REG-001.
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field
      description: Which field is wrong (for example coverage, version, license, access level).
    validations:
      required: true
  - type: textarea
    id: current_value
    attributes:
      label: Current value
      description: What the catalog says now.
    validations:
      required: true
  - type: textarea
    id: proposed_value
    attributes:
      label: Proposed value
      description: What it should say.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: A page that confirms the proposed value (official page, codebook or publication).
    validations:
      required: true
